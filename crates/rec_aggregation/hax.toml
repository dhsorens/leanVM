# The Lean extraction of this crate (formal/extraction/README.md), regenerated with
# `formal/extraction/hax.sh extract` into proofs/rec-aggregation/lean.
#
# `opaque` items are extracted as signatures only, axioms in Assumptions/FunsExternal.lean.
# Each is grouped by what stops it, so the list is also the work left. The items this crate
# uses from other workspace crates are axioms in Assumptions/CratesExternal.lean.
[scenario.rec-aggregation]
backend = "lean"
opaque = [
  # Proving: tracing spans (their callsite statics form type and function groups Aeneas
  # rejects), the thread pool and prover kernels.
  "crate::aggregation::_::recompute",
  "crate::aggregation::_::recompute_scalar",
  "crate::aggregation::aggregate_deferred_claims",
  "crate::aggregation::aggregate_with_stats",
  "crate::aggregation::round_msg_base",
  "crate::aggregation::fold_lsb_base",
  "crate::aggregation::fold_lsb",
  "crate::aggregation::round_msg",
  "crate::aggregation::weighted_eq_table",

  # Process-wide caches in `OnceLock` statics.
  "crate::aggregation::stacked_bytecode",
  "crate::aggregation::scalar_bytecode",
  "crate::aggregation::unified_guest",
  "crate::aggregation::bytecode_window",

  # The guest's zkDSL source, built with `format!` and a map of string placeholders (one a
  # `dyn` closure, aggregation.rs:2412), then compiled.
  "crate::aggregation::f192_literal",
  "crate::aggregation::literals",
  "crate::aggregation::placeholder_map",
  "crate::aggregation::compile_guest",

  # The wire format, bincode over serde.
  "crate::aggregation::_::to_bytes",
  "crate::aggregation::_::from_bytes",
  "crate::aggregation::_::to_bytes_without_pubkeys",
  "crate::aggregation::_::from_bytes_without_pubkeys",

  # Aeneas cannot end or join the borrows of these loops (aggregation.rs:1153 `walk_claims`,
  # 1438 `plan`, 1516 `plan_coverage`, 1558 `lean_xmss_hints`, 1588 `push_lean_sphincs_hints`),
  # or translate a function item over references used as a closure (`gen_verify`'s
  # `sides.map(leaf::layout)`: a higher-ranked lifetime).
  "crate::aggregation::walk_claims",
  "crate::aggregation::_::plan",
  "crate::aggregation::plan_coverage",
  "crate::aggregation::lean_xmss_hints",
  "crate::aggregation::push_lean_sphincs_hints",
  "crate::aggregation::gen_verify",

  # Standard-library items CoreModels lacks: the order of tuples and arrays (strict sorting
  # of the signer and root lists, a `Region`'s `Ord` keys), `slice::IterMut`, `Rev::fold`, and
  # `iter_mut().find` (whose signature crashes Aeneas, see `exclude`).
  "crate::aggregation::check_signer_set",
  "crate::aggregation::check_da_roots",
  "crate::aggregation::_::n_total",
  "crate::aggregation::_::n_slots",
  "crate::aggregation::slot_weights",
  "crate::aggregation::digit_hints",
  "crate::aggregation::_::push",

  # Match on `leanvm_core::leaf::Coord`, recursive through a `Vec`, which a hand-written mirror
  # cannot declare (the hax Lean library's `Vec` is not a nested-inductive container).
  "crate::aggregation::coord_kind",
  "crate::aggregation::coord_scale",
  "crate::aggregation::push_coord_terms",

  # Reads the fields of `pcs`'s WHIR configuration, another crate's internals.
  "crate::aggregation::whir_shape",
]
exclude = [
  # `Error::source` is not a field of the hax Lean library's `Error`.
  "{impl core::error::Error for crate::aggregation::AggregateVerifyError}",
  "{impl core::error::Error for crate::aggregation::AggregationError}",
  # Derived `Clone` of a container of tuples: Aeneas's builtin `Clone` does not match the hax
  # Lean library's. Unused by the extracted code.
  "{impl core::clone::Clone for crate::aggregation::EthereumProof}",
  "{impl core::clone::Clone for crate::aggregation::SignatureClaims}",
  # bincode's options type, used only by the opaque wire format; and the serde impls.
  "crate::aggregation::wire",
  "{impl serde_core::ser::Serialize for _}",
  "{impl serde_core::de::Deserialize for _}",
  # Their signatures crash Aeneas while translating the `Iterator` trait.
  "core::iter::traits::iterator::Iterator::copied",
  "core::iter::traits::iterator::Iterator::find",
  "core::slice::iter::_::find",
]
